<!DOCTYPE html>

<title>SYSCOREE | Exploración de Marte</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    min-height:100vh;
    background:#080c12;
    color:#edf3f8;
    font-family:Inter,Arial,sans-serif;
    display:flex;

    align-items:center;

    padding:30px;
}
.contenedor{
    width:100%;

    flex-direction:column;

    margin-bottom:30px;
}

    text-decoration:none;
    background:linear-gradient(100deg,#f18a58,#d85b3c);
    color:white;
    padding:15px 35px;

    letter-spacing:1.5px;
